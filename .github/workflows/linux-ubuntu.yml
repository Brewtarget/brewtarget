name: Linux

on:
  push:
    branches:
      - main
      - "stable/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * *"

permissions: read-all

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      # Needed for apt in the container (otherwise eg tzdata can stop and wait for input)
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC
    strategy:
      fail-fast: false
      matrix:
        #
        # See https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
        # for info on runner images
        #
        # Usually "ubuntu-latest" is the most recent LTS version of Ubuntu, but there can be a bit of lag between a new
        # LTS release and the update of ubuntu-latest (eg in October 2022, it was still Ubuntu 20.04 rather than 22.04).
        # So we explicitly specify here which versions we want to build on.
        #
        # 'os' is the name we use for the build (eg in artifact names).
        #
        # The GitHub ubuntu-26.04 runner image is an amd64v3 install, ie its toolchain and libraries target x86-64-v3
        # (AVX2 etc).  Binaries built directly on it will not run on older CPUs (see
        # https://github.com/Brewtarget/brewtarget/issues/1179).  Setting -march on our own code is not sufficient,
        # because pre-built objects from the system (static libraries, C runtime objects) still get linked in.  So,
        # for Ubuntu 26.04, we build inside the official ubuntu:26.04 Docker image, which is a baseline amd64 install.
        #
        # Inside the container, we don't have the setup needed for building AppImage or Flatpak (eg FUSE, and the
        # privileges that bubblewrap needs).  Those are portable formats, so we only build them on Ubuntu 24.04.
        #
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            container: ''
            buildContainerApps: true
          - os: ubuntu-26.04
            runner: ubuntu-24.04
            container: ubuntu:26.04
            buildContainerApps: false
    steps:
      #
      # Building flatpak etc below takes a fair bit of disk space, we start out by removing preinstalled software that
      # we don't need.  (Inside a container, we can't get at the host file system to do this.)
      #
      - name: Free disk space
        if: ${{ matrix.container == '' }}
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      #
      # The ubuntu Docker images are minimal, so we need to install a few things that GitHub runner images have by
      # default.  In particular:
      #   - git, before checkout, so that actions/checkout does a proper clone (with history and submodules) rather than
      #     downloading a tarball
      #   - sudo, because the bt scripts use it (running as root in the container, it doesn't need a password)
      #   - lsb-release, which bt uses to determine the distro and release
      #   - Python and the bits that btInit.py would otherwise try to install interactively
      #
      # The checkout is owned by a different user than the one (root) the job runs as in the container, so we need to
      # tell git that's OK.
      #
      - name: Prepare container
        if: ${{ matrix.container != '' }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
             ca-certificates curl file git lsb-release sudo xz-utils \
             python3 python3-dev python3-pip python3-setuptools python3-venv
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      #
      # Log what the toolchain targets by default, as this is useful for diagnosing ISA-level problems.  (On an amd64v3
      # install, `dpkg --print-architecture` still says amd64, so we look at the compiler too.)
      #
      - name: Show build environment architecture
        shell: bash
        run: |
          dpkg --print-architecture || true
          if command -v gcc >/dev/null; then gcc -Q --help=target | grep -E '^\s+-march=' || true; fi

      #
      # See https://github.com/Brewtarget/brewtarget/wiki/Development:-Getting-Started for more on what is needed to build
      # the software.  Most of this is now automated in 'bt setup all'.
      #
      # Some of the things that the bt script installs could be installed via actions (eg jurplel/install-qt-action@v3)
      # and some are already installed by default for GitHub actions (eg cmake, git, debhelper, rpm) but there's an
      # advantage, where we can, in doing the exact same steps that give as instructions to developers to set up their
      # build environment.
      #
      # Of course, since 'bt' is a Python script, it can't install Python, so we need to do that first.  We need Python
      # 3.10 or newer, which means you can't just use `sudo apt install` on older Ubuntus.  (Eg Ubuntu 18.04 packages
      # have only Python 3.6.7 and Ubuntu 20.04 only have Python 3.8.2.  However Ubuntu 22.04 has Python 3.10.6.)  There
      # are ways to get around this, but, in this context, it's simplest to use a canned GitHub action.
      #
      # In the container, we use the distro's own Python (installed above), which is new enough on Ubuntu 26.04
      - uses: actions/setup-python@v6
        if: ${{ matrix.container == '' }}
        with:
          python-version: '3.10'
      - name: Install Frameworks and Libraries, and set up Meson build environment
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          pwd
          ./bt -v setup all

      - name: Create CMake build environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Build (with Meson)
        id: meson-build
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          pwd
          meson compile

      # The 'export QT_DEBUG_PLUGINS=1' give us diagnostics in the event that there are problems initialising QT
      # The 'export QT_QPA_PLATFORM=offscreen' stops Qt's xcb submodule trying to connect to a non-existent display
      # (which would cause the test runner to abort before running any tests).
      - name: Test (via Meson)
        id: meson-test
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          export QT_DEBUG_PLUGINS=1
          export QT_QPA_PLATFORM=offscreen
          meson test

      #
      # As explained at https://hnsws.blogspot.com/2026/05/openspace-builds-on-github-actions.html, it's possible for a
      # highly parallel CMake build to run out of memory on a GitHub Action runner.  You'll see output along the
      # following lines:
      #
      #    gmake[2]: *** [ CMakeFiles/btobjlib.dir/build.make:239: CMakeFiles/btobjlib.dir/src/Algorithms.cpp.o ] Terminated
      #    gmake[1]: *** [ CMakeFiles/Makefile2:206: CMakeFiles/btobjlib.dir/all ] Terminated
      #    gmake: *** [ Makefile:146: all ] Terminated
      #    Error: Process completed with exit code 143.
      #
      # Hence, we limit parallelism below
      #
      - name: Build (with CMake)
        id: cmake-build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
           cmake --build . --parallel 3

      - name: Test (via CMake)
        id: cmake-test
        working-directory: ${{github.workspace}}/build
        shell: bash
        env:
          CTEST_OUTPUT_ON_FAILURE: TRUE
          QT_QPA_PLATFORM: minimal
        run: |
          make test

      #
      # Note that, although we continue to support CMake for local builds and installs, we no longer support packaging
      # with CPack/CMake.  The bt build script packaging gives us better control over the packaging process.
      #
      # This means, at this point, if the CMake build and tests succeeded, we could delete the build directory here if
      # we need more disk space in future.  For the moment, we don't, and we allow the build directory to be a
      # downloadable artifact even when the build succeeds (see below).
      #

      #
      # I did also have the idea of doing a subsequent step to try installing the package (eg via
      # `sudo apt -f install ./brew*.deb`) but, in practice this gives errors about the following packages not being
      # installable:
      #    libqt6core6t64
      #    libqt6gui6t64
      #    libqt6network6t64
      #    libqt6printsupport6t64
      #    libqt6sql6t64
      #    libqt6widgets6t64
      #    libxalan-c112t64
      #    libxerces-c3.2t64
      #
      # I suspect this is because there are restrictions on what you can install on GitHub action runners - presumably
      # because they want you not to do things other than builds with them.
      #
      - name: Package
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          umask 022
          ../bt package

      #
      # Make sure what we built will run on any x86-64 CPU.  See comments in scripts/checkIsaLevel.sh.  If this fails,
      # it's probably because something in the build environment (eg the GitHub runner image) has changed to target a
      # newer instruction set.
      #
      - name: Check packaged binaries run on baseline x86-64
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          # The binary in the build directory normally still has its full symbol table, which lets the script say
          # exactly which functions contain any problem instructions.  The one in the .deb is what we actually ship.
          ../scripts/checkIsaLevel.sh brewtarget packages/linux/brewtarget*.deb

      - name: AppImage
        if: ${{ matrix.buildContainerApps }}
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          umask 022
          ../bt -v appimage

      - name: Flatpak
        if: ${{ matrix.buildContainerApps }}
        working-directory: ${{github.workspace}}/mbuild
        shell: bash
        run: |
          umask 022
          ../bt -v flatpak

      - name: Upload Linux Packages (Installers)
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: brewtarget-${{matrix.os}}
          path: |
            mbuild/packages/source/brewtarget*.tar.xz
            mbuild/packages/source/brewtarget*.tar.xz.sha256sum
            mbuild/packages/linux/brewtarget*.deb
            mbuild/packages/linux/brewtarget*.deb.sha256sum
            mbuild/packages/linux/brewtarget*.rpm
            mbuild/packages/linux/brewtarget*.rpm.sha256sum
            contAppPkgs/appimage/brewtarget*.AppImage
            contAppPkgs/appimage/brewtarget*.AppImage.sha256sum
            contAppPkgs/flatpak/brewtarget*.flatpak
            contAppPkgs/flatpak/brewtarget*.flatpak.sha256sum
          retention-days: 7

      - name: Recover Debris Artifacts (Meson)
        if: ${{ failure() && (steps.meson-build.conclusion == 'failure' || steps.meson-test.conclusion == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: mbuild-results-${{matrix.os}}
          path: mbuild
          retention-days: 1

      - name: Recover Debris Artifacts (CMake)
        if: ${{ failure() && (steps.cmake-build.conclusion == 'failure' || steps.cmake-test.conclusion == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{matrix.os}}
          path: build
          retention-days: 1

      # Meson test doesn't show log output on the terminal, but puts it straight to a log file.  We don't want to have
      # to download the whole compressed mbuild tree just to see the log in event of a test failure, so we show it here
      # (provided it exists).
      - name: Show Meson test logs
        if: ${{ failure() }}
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          if [[ -f mbuild/meson-logs/testlog.txt ]]; then cat mbuild/meson-logs/testlog.txt; fi